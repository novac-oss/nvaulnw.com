<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Daisy the Duck quacking happily">
  <defs>
    <radialGradient id="duck-face" cx=".4" cy=".4" r=".7">
      <stop offset="0" stop-color="#FFE16A"/>
      <stop offset="1" stop-color="#F2B91A"/>
    </radialGradient>
    <linearGradient id="duck-beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9933"/>
      <stop offset="1" stop-color="#E36A0F"/>
    </linearGradient>
  </defs>
  <!-- Hair tuft -->
  <path d="M28 8 Q32 2 36 8" fill="none" stroke="#F2B91A" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="32" cy="36" rx="22" ry="20" fill="url(#duck-face)"/>
  <!-- Cheek blush -->
  <ellipse cx="16" cy="42" rx="4.5" ry="3" fill="#FF8FA8" opacity=".55"/>
  <ellipse cx="48" cy="42" rx="4.5" ry="3" fill="#FF8FA8" opacity=".55"/>
  <!-- Eyes (big happy) -->
  <ellipse cx="24" cy="32" rx="3" ry="3.4" fill="#1A1F2B"/>
  <ellipse cx="40" cy="32" rx="3" ry="3.4" fill="#1A1F2B"/>
  <circle cx="25" cy="30.8" r="1" fill="#fff"/>
  <circle cx="41" cy="30.8" r="1" fill="#fff"/>
  <circle cx="23.5" cy="33" r=".4" fill="#fff"/>
  <circle cx="39.5" cy="33" r=".4" fill="#fff"/>
  <!-- Beak (open, quacking) -->
  <path d="M22 44 Q32 50 42 44 L42 48 Q32 54 22 48 Z" fill="url(#duck-beak)"/>
  <path d="M22 44 Q32 50 42 44 L42 48 Q32 54 22 48 Z" fill="none" stroke="#A64A05" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M22 46 Q32 49 42 46" fill="none" stroke="#A64A05" stroke-width="1" opacity=".6"/>
  <!-- Tongue -->
  <ellipse cx="32" cy="48" rx="5" ry="1.8" fill="#FF6B95" opacity=".75"/>
  <!-- Sound waves -->
  <path d="M50 30 Q56 32 56 36" fill="none" stroke="#FFB547" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M53 26 Q61 30 60 38" fill="none" stroke="#FFB547" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
  <path d="M8 30 Q4 32 4 36" fill="none" stroke="#FFB547" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>
  <!-- Flower on head -->
  <circle cx="10" cy="14" r="2" fill="#FF6B95"/>
  <circle cx="7" cy="12" r="1.5" fill="#FF6B95"/>
  <circle cx="13" cy="12" r="1.5" fill="#FF6B95"/>
  <circle cx="7" cy="16" r="1.5" fill="#FF6B95"/>
  <circle cx="13" cy="16" r="1.5" fill="#FF6B95"/>
  <circle cx="10" cy="14" r="1" fill="#FFB547"/>
</svg>
