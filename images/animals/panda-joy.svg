<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Bao the Panda waving joyfully">
  <defs>
    <radialGradient id="panda-face" cx=".4" cy=".4" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E5E8EE"/>
    </radialGradient>
  </defs>
  <!-- Ears (black) -->
  <circle cx="13" cy="16" r="7" fill="#1A1F2B"/>
  <circle cx="51" cy="16" r="7" fill="#1A1F2B"/>
  <circle cx="13" cy="16" r="3.2" fill="#FF8FA8" opacity=".4"/>
  <circle cx="51" cy="16" r="3.2" fill="#FF8FA8" opacity=".4"/>
  <!-- Head -->
  <ellipse cx="32" cy="36" rx="22" ry="21" fill="url(#panda-face)"/>
  <!-- Eye patches (black) -->
  <ellipse cx="22" cy="33" rx="6" ry="7.5" fill="#1A1F2B" transform="rotate(-15 22 33)"/>
  <ellipse cx="42" cy="33" rx="6" ry="7.5" fill="#1A1F2B" transform="rotate(15 42 33)"/>
  <!-- Eyes (sparkly) -->
  <circle cx="22" cy="33" r="2.4" fill="#fff"/>
  <circle cx="42" cy="33" r="2.4" fill="#fff"/>
  <circle cx="22.6" cy="33.6" r="1" fill="#1A1F2B"/>
  <circle cx="42.6" cy="33.6" r="1" fill="#1A1F2B"/>
  <!-- Nose -->
  <ellipse cx="32" cy="41" rx="2.2" ry="1.6" fill="#1A1F2B"/>
  <!-- Mouth (open joy) -->
  <path d="M28 45 Q32 51 36 45 Q32 49 28 45 Z" fill="#FF6B95"/>
  <path d="M28 45 Q32 51 36 45" fill="none" stroke="#1A1F2B" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <ellipse cx="14" cy="42" rx="3.5" ry="2" fill="#FF8FA8" opacity=".5"/>
  <ellipse cx="50" cy="42" rx="3.5" ry="2" fill="#FF8FA8" opacity=".5"/>
  <!-- Waving paw (top right) -->
  <circle cx="56" cy="22" r="5" fill="#1A1F2B"/>
  <circle cx="58" cy="18" r="2" fill="#E5E8EE"/>
  <!-- Confetti -->
  <rect x="6" y="8" width="2" height="3" fill="#FFB547" transform="rotate(20 7 9)"/>
  <rect x="58" y="48" width="2" height="3" fill="#26E0C5" transform="rotate(-15 59 49)"/>
  <circle cx="10" cy="30" r="1.3" fill="#7B5CFF"/>
  <circle cx="56" cy="52" r="1.3" fill="#4D8BFF"/>
</svg>
