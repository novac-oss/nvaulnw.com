<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Hugo the Owl with glasses">
  <defs>
    <radialGradient id="owl-face" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#A77B4E"/>
      <stop offset="1" stop-color="#6B4423"/>
    </radialGradient>
    <radialGradient id="owl-belly" cx=".5" cy=".4" r=".7">
      <stop offset="0" stop-color="#E8D5B7"/>
      <stop offset="1" stop-color="#C9A77E"/>
    </radialGradient>
  </defs>
  <!-- Ear tufts -->
  <path d="M12 14 L10 4 L20 12 Z" fill="#6B4423"/>
  <path d="M52 14 L54 4 L44 12 Z" fill="#6B4423"/>
  <!-- Body -->
  <ellipse cx="32" cy="38" rx="22" ry="22" fill="url(#owl-face)"/>
  <!-- Belly -->
  <ellipse cx="32" cy="44" rx="14" ry="16" fill="url(#owl-belly)"/>
  <!-- Belly feather lines -->
  <path d="M24 44 Q32 47 40 44" fill="none" stroke="#A77B4E" stroke-width=".8" opacity=".5"/>
  <path d="M24 48 Q32 51 40 48" fill="none" stroke="#A77B4E" stroke-width=".8" opacity=".5"/>
  <path d="M24 52 Q32 55 40 52" fill="none" stroke="#A77B4E" stroke-width=".8" opacity=".5"/>
  <!-- Eye discs (light) -->
  <circle cx="24" cy="32" r="9" fill="#FFF5EC"/>
  <circle cx="40" cy="32" r="9" fill="#FFF5EC"/>
  <!-- Glasses frames -->
  <circle cx="24" cy="32" r="9" fill="none" stroke="#1A1F2B" stroke-width="1.6"/>
  <circle cx="40" cy="32" r="9" fill="none" stroke="#1A1F2B" stroke-width="1.6"/>
  <line x1="33" y1="32" x2="31" y2="32" stroke="#1A1F2B" stroke-width="1.6"/>
  <!-- Pupils -->
  <circle cx="24" cy="33" r="2.4" fill="#1A1F2B"/>
  <circle cx="40" cy="33" r="2.4" fill="#1A1F2B"/>
  <circle cx="24.8" cy="32.2" r=".7" fill="#fff"/>
  <circle cx="40.8" cy="32.2" r=".7" fill="#fff"/>
  <!-- Beak -->
  <path d="M28 40 L32 46 L36 40 Z" fill="#FFB547"/>
  <path d="M28 40 L32 46 L36 40 Z" fill="none" stroke="#C68A2E" stroke-width=".8" stroke-linejoin="round"/>
  <!-- Book accent -->
  <rect x="6" y="50" width="10" height="7" rx="1" fill="#4D8BFF" opacity=".75"/>
  <line x1="11" y1="50" x2="11" y2="57" stroke="#fff" stroke-width=".6" opacity=".7"/>
  <line x1="8" y1="52" x2="14" y2="52" stroke="#fff" stroke-width=".5" opacity=".6"/>
  <line x1="8" y1="54" x2="14" y2="54" stroke="#fff" stroke-width=".5" opacity=".6"/>
</svg>
