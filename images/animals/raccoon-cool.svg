<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Riku the Raccoon with sunglasses">
  <defs>
    <radialGradient id="rac-face" cx=".4" cy=".4" r=".7">
      <stop offset="0" stop-color="#D7D9DD"/>
      <stop offset="1" stop-color="#8E94A0"/>
    </radialGradient>
    <linearGradient id="rac-sunglasses" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1F2B"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="rac-shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D8BFF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#4D8BFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Ears -->
  <path d="M10 22 L6 8 L22 18 Z" fill="#8E94A0"/>
  <path d="M54 22 L58 8 L42 18 Z" fill="#8E94A0"/>
  <path d="M13 20 L11 12 L20 18 Z" fill="#FFB6C8"/>
  <path d="M51 20 L53 12 L44 18 Z" fill="#FFB6C8"/>
  <!-- Head -->
  <ellipse cx="32" cy="38" rx="22" ry="20" fill="url(#rac-face)"/>
  <!-- Dark face mask (classic raccoon) -->
  <path d="M12 32 Q14 24 22 24 L42 24 Q50 24 52 32 Q52 44 32 50 Q12 44 12 32 Z" fill="#4A4F5A" opacity=".75"/>
  <!-- White snout -->
  <path d="M22 44 Q32 56 42 44 Q40 52 32 54 Q24 52 22 44 Z" fill="#F2F2F4"/>
  <!-- Sunglasses frames -->
  <rect x="11" y="29" width="18" height="11" rx="3" fill="url(#rac-sunglasses)"/>
  <rect x="35" y="29" width="18" height="11" rx="3" fill="url(#rac-sunglasses)"/>
  <line x1="29" y1="33" x2="35" y2="33" stroke="#1A1F2B" stroke-width="1.6"/>
  <!-- Lens shine -->
  <path d="M14 31 Q18 30 22 32 L18 35 L13 33 Z" fill="url(#rac-shine)"/>
  <path d="M38 31 Q42 30 46 32 L42 35 L37 33 Z" fill="url(#rac-shine)"/>
  <!-- Nose -->
  <ellipse cx="32" cy="46" rx="2.2" ry="1.5" fill="#1A1F2B"/>
  <!-- Smug smile -->
  <path d="M28 50 Q32 53 36 50" fill="none" stroke="#1A1F2B" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Headphones accent -->
  <path d="M8 24 Q4 14 14 10" fill="none" stroke="#4D8BFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M56 24 Q60 14 50 10" fill="none" stroke="#4D8BFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="8" cy="26" r="2.5" fill="#4D8BFF"/>
  <circle cx="56" cy="26" r="2.5" fill="#4D8BFF"/>
</svg>
