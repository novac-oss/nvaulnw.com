<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="N VaulNW hero scene with mascots and devices">
  <defs>
    <!-- Background mesh gradients -->
    <radialGradient id="hero-mesh-1" cx=".2" cy=".25" r=".6">
      <stop offset="0" stop-color="#4D8BFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4D8BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-mesh-2" cx=".78" cy=".3" r=".55">
      <stop offset="0" stop-color="#7B5CFF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-mesh-3" cx=".55" cy=".85" r=".6">
      <stop offset="0" stop-color="#26E0C5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#26E0C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-mesh-4" cx=".92" cy=".82" r=".5">
      <stop offset="0" stop-color="#FFB547" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>

    <!-- Phone screen gradient -->
    <linearGradient id="hero-phone-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2233"/>
      <stop offset="1" stop-color="#0F1320"/>
    </linearGradient>
    <linearGradient id="hero-phone-bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3142"/>
      <stop offset="1" stop-color="#0E1320"/>
    </linearGradient>
    <linearGradient id="hero-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2030" stop-opacity=".95"/>
      <stop offset="1" stop-color="#11151D" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="hero-card-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2438" stop-opacity=".95"/>
      <stop offset="1" stop-color="#0F1525" stop-opacity=".95"/>
    </linearGradient>

    <linearGradient id="hero-chart-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26E0C5" stop-opacity=".5"/>
      <stop offset="1" stop-color="#26E0C5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D8BFF"/>
      <stop offset="1" stop-color="#7B5CFF"/>
    </linearGradient>
    <linearGradient id="hero-grad-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26E0C5"/>
      <stop offset="1" stop-color="#4D8BFF"/>
    </linearGradient>

    <filter id="hero-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="hero-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <symbol id="hero-spark" viewBox="-10 -10 20 20">
      <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="url(#hero-grad)"/>
    </symbol>
  </defs>

  <!-- Background mesh -->
  <rect width="1200" height="600" fill="#0B0E14"/>
  <rect width="1200" height="600" fill="url(#hero-mesh-1)"/>
  <rect width="1200" height="600" fill="url(#hero-mesh-2)"/>
  <rect width="1200" height="600" fill="url(#hero-mesh-3)"/>
  <rect width="1200" height="600" fill="url(#hero-mesh-4)"/>

  <!-- Subtle horizon line -->
  <line x1="0" y1="500" x2="1200" y2="500" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="rgba(255,255,255,.025)" stroke-width="1"/>

  <!-- Background orbs (blurred) -->
  <g filter="url(#hero-glow)" opacity=".55">
    <circle cx="180" cy="160" r="120" fill="#4D8BFF" opacity=".35"/>
    <circle cx="980" cy="120" r="150" fill="#7B5CFF" opacity=".32"/>
    <circle cx="600" cy="520" r="180" fill="#26E0C5" opacity=".22"/>
  </g>

  <!-- Distant particle field -->
  <g fill="#E6EAF2">
    <circle cx="80" cy="80" r="1.4" opacity=".7"/>
    <circle cx="140" cy="240" r="1" opacity=".5"/>
    <circle cx="220" cy="60" r="1.6" opacity=".6"/>
    <circle cx="300" cy="160" r="1" opacity=".4"/>
    <circle cx="380" cy="80" r="1.4" opacity=".55"/>
    <circle cx="460" cy="200" r="1" opacity=".4"/>
    <circle cx="540" cy="50" r="1.6" opacity=".7"/>
    <circle cx="640" cy="180" r="1" opacity=".5"/>
    <circle cx="740" cy="100" r="1.4" opacity=".55"/>
    <circle cx="840" cy="220" r="1" opacity=".4"/>
    <circle cx="920" cy="60" r="1.6" opacity=".6"/>
    <circle cx="1020" cy="200" r="1" opacity=".5"/>
    <circle cx="1100" cy="80" r="1.2" opacity=".6"/>
    <circle cx="1140" cy="280" r="1" opacity=".45"/>
    <circle cx="60" cy="420" r="1.2" opacity=".5"/>
    <circle cx="180" cy="500" r="1.4" opacity=".55"/>
    <circle cx="320" cy="540" r="1" opacity=".4"/>
    <circle cx="800" cy="540" r="1.4" opacity=".55"/>
    <circle cx="1060" cy="500" r="1" opacity=".4"/>
  </g>
  <g>
    <use href="#hero-spark" x="120" y="120" width="14" height="14" opacity=".7"/>
    <use href="#hero-spark" x="1080" y="160" width="10" height="10" opacity=".6"/>
    <use href="#hero-spark" x="220" y="380" width="9" height="9" opacity=".55"/>
    <use href="#hero-spark" x="980" y="380" width="12" height="12" opacity=".55"/>
    <use href="#hero-spark" x="500" y="100" width="8" height="8" opacity=".7"/>
  </g>

  <!-- Floating UI cards (left of phone) -->
  <!-- Chat bubble card -->
  <g transform="translate(140 150) rotate(-6)">
    <rect x="0" y="0" width="200" height="76" rx="14" fill="url(#hero-card)" stroke="rgba(255,255,255,.08)"/>
    <circle cx="22" cy="24" r="11" fill="url(#hero-grad)"/>
    <text x="20" y="28" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">N</text>
    <rect x="42" y="16" width="120" height="6" rx="3" fill="rgba(255,255,255,.6)"/>
    <rect x="42" y="28" width="140" height="5" rx="2.5" fill="rgba(255,255,255,.3)"/>
    <rect x="42" y="38" width="100" height="5" rx="2.5" fill="rgba(255,255,255,.3)"/>
    <rect x="14" y="54" width="170" height="14" rx="7" fill="rgba(77,139,255,.18)" stroke="rgba(77,139,255,.4)"/>
    <text x="22" y="64" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600" fill="#4D8BFF">Live preview ready</text>
  </g>

  <!-- Chart / analytics card (right of phone) -->
  <g transform="translate(880 130) rotate(5)">
    <rect x="0" y="0" width="240" height="150" rx="16" fill="url(#hero-card-2)" stroke="rgba(255,255,255,.08)"/>
    <text x="18" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#E6EAF2">Analytics</text>
    <text x="18" y="44" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#8A93A6">Last 7 days</text>
    <!-- Chart -->
    <path d="M18 120 L40 100 L62 108 L84 84 L106 90 L128 64 L150 74 L172 50 L194 58 L216 38" fill="none" stroke="url(#hero-grad-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 120 L40 100 L62 108 L84 84 L106 90 L128 64 L150 74 L172 50 L194 58 L216 38 L216 130 L18 130 Z" fill="url(#hero-chart-fill)"/>
    <circle cx="216" cy="38" r="4" fill="#26E0C5"/>
    <circle cx="216" cy="38" r="8" fill="#26E0C5" opacity=".25"/>
    <!-- Bars below -->
    <rect x="18" y="136" width="6" height="6" rx="1" fill="rgba(255,255,255,.4)"/>
    <rect x="32" y="132" width="6" height="10" rx="1" fill="rgba(255,255,255,.4)"/>
    <rect x="46" y="128" width="6" height="14" rx="1" fill="rgba(255,255,255,.4)"/>
    <rect x="60" y="124" width="6" height="18" rx="1" fill="rgba(255,255,255,.4)"/>
  </g>

  <!-- Notification card (lower left) -->
  <g transform="translate(120 380) rotate(4)">
    <rect x="0" y="0" width="190" height="60" rx="12" fill="url(#hero-card)" stroke="rgba(255,255,255,.08)"/>
    <circle cx="26" cy="30" r="14" fill="#26E0C5" opacity=".2"/>
    <path d="M22 30 l3 3 l6 -6" stroke="#26E0C5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="16" width="120" height="6" rx="3" fill="rgba(255,255,255,.55)"/>
    <rect x="48" y="28" width="100" height="5" rx="2.5" fill="rgba(255,255,255,.3)"/>
    <rect x="48" y="40" width="80" height="5" rx="2.5" fill="rgba(255,255,255,.3)"/>
  </g>

  <!-- Heart / reaction card (lower right) -->
  <g transform="translate(940 360) rotate(-7)">
    <rect x="0" y="0" width="160" height="80" rx="14" fill="url(#hero-card-2)" stroke="rgba(255,255,255,.08)"/>
    <path d="M30 50 c-6 -4 -12 -10 -12 -18 c0 -6 5 -10 10 -10 c3 0 6 1 8 4 c2 -3 5 -4 8 -4 c5 0 10 4 10 10 c0 8 -6 14 -12 18 l-6 4 z" transform="translate(0 0) scale(0.9)" fill="#FF6B95" opacity=".9"/>
    <rect x="68" y="20" width="74" height="6" rx="3" fill="rgba(255,255,255,.55)"/>
    <rect x="68" y="32" width="58" height="5" rx="2.5" fill="rgba(255,255,255,.3)"/>
    <rect x="68" y="44" width="64" height="5" rx="2.5" fill="rgba(255,255,255,.3)"/>
    <rect x="68" y="58" width="40" height="14" rx="7" fill="rgba(255,107,149,.2)" stroke="rgba(255,107,149,.5)"/>
    <text x="78" y="68" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600" fill="#FF6B95">+128</text>
  </g>

  <!-- Big translucent phone (center) -->
  <g transform="translate(450 60)">
    <!-- Phone shadow -->
    <rect x="20" y="40" width="280" height="500" rx="38" fill="#000" opacity=".4" filter="url(#hero-soft)"/>
    <!-- Phone bezel -->
    <rect x="0" y="0" width="280" height="500" rx="36" fill="url(#hero-phone-bezel)" stroke="rgba(255,255,255,.12)"/>
    <!-- Inner screen frame -->
    <rect x="10" y="10" width="260" height="480" rx="28" fill="url(#hero-phone-screen)"/>
    <!-- Notch -->
    <rect x="110" y="14" width="60" height="14" rx="7" fill="#0B0E14"/>
    <circle cx="160" cy="21" r="2.4" fill="#1B2233"/>
    <circle cx="160" cy="21" r="1" fill="#26E0C5" opacity=".5"/>

    <!-- Status bar -->
    <text x="30" y="46" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#E6EAF2">9:41</text>
    <g transform="translate(220 38)">
      <rect x="0" y="0" width="14" height="6" rx="1" fill="none" stroke="#E6EAF2" stroke-width=".8"/>
      <rect x="2" y="2" width="9" height="2" fill="#E6EAF2"/>
      <rect x="14.5" y="2" width="1.5" height="2" fill="#E6EAF2"/>
    </g>

    <!-- App header -->
    <text x="30" y="76" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#E6EAF2">Discover</text>
    <circle cx="240" cy="72" r="11" fill="url(#hero-grad)"/>
    <text x="240" y="76" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">N</text>

    <!-- Featured card -->
    <rect x="22" y="90" width="236" height="110" rx="14" fill="url(#hero-grad)"/>
    <rect x="22" y="90" width="236" height="110" rx="14" fill="url(#hero-card-2)" opacity=".35"/>
    <text x="36" y="118" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">New Drop</text>
    <text x="36" y="134" font-family="Inter, system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,.7)">Puzzle • Action • Casual</text>
    <rect x="36" y="146" width="56" height="22" rx="11" fill="rgba(255,255,255,.18)"/>
    <text x="64" y="161" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">PLAY</text>
    <!-- Abstract phone mockup inside -->
    <g transform="translate(160 110)">
      <rect x="0" y="0" width="56" height="80" rx="8" fill="rgba(255,255,255,.18)"/>
      <circle cx="28" cy="40" r="16" fill="#FFB547" opacity=".85"/>
      <rect x="8" y="62" width="40" height="4" rx="2" fill="rgba(255,255,255,.5)"/>
      <rect x="14" y="70" width="28" height="3" rx="1.5" fill="rgba(255,255,255,.3)"/>
    </g>

    <!-- Tiles grid -->
    <g transform="translate(22 216)">
      <!-- Tile 1 -->
      <rect x="0" y="0" width="74" height="84" rx="12" fill="rgba(77,139,255,.18)" stroke="rgba(77,139,255,.4)"/>
      <circle cx="37" cy="36" r="16" fill="#4D8BFF" opacity=".4"/>
      <path d="M28 36 l8 8 l16 -16" stroke="#4D8BFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="12" y="62" width="50" height="5" rx="2.5" fill="rgba(255,255,255,.5)"/>
      <rect x="18" y="72" width="38" height="4" rx="2" fill="rgba(255,255,255,.3)"/>
      <!-- Tile 2 -->
      <rect x="82" y="0" width="74" height="84" rx="12" fill="rgba(123,92,255,.18)" stroke="rgba(123,92,255,.4)"/>
      <circle cx="119" cy="36" r="16" fill="#7B5CFF" opacity=".4"/>
      <path d="M110 36 h18 M119 27 v18" stroke="#7B5CFF" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="94" y="62" width="50" height="5" rx="2.5" fill="rgba(255,255,255,.5)"/>
      <rect x="100" y="72" width="38" height="4" rx="2" fill="rgba(255,255,255,.3)"/>
      <!-- Tile 3 -->
      <rect x="164" y="0" width="74" height="84" rx="12" fill="rgba(38,224,197,.18)" stroke="rgba(38,224,197,.4)"/>
      <circle cx="201" cy="36" r="16" fill="#26E0C5" opacity=".4"/>
      <path d="M192 36 l4 4 l12 -12" stroke="#26E0C5" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="176" y="62" width="50" height="5" rx="2.5" fill="rgba(255,255,255,.5)"/>
      <rect x="182" y="72" width="38" height="4" rx="2" fill="rgba(255,255,255,.3)"/>
    </g>

    <!-- Bottom list rows -->
    <g transform="translate(22 320)">
      <rect x="0" y="0" width="236" height="46" rx="12" fill="rgba(255,255,255,.04)"/>
      <rect x="10" y="9" width="28" height="28" rx="8" fill="url(#hero-grad)"/>
      <path d="M20 23 l3 3 l8 -8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="48" y="14" width="100" height="5" rx="2.5" fill="rgba(255,255,255,.55)"/>
      <rect x="48" y="24" width="70" height="4" rx="2" fill="rgba(255,255,255,.3)"/>
      <text x="216" y="28" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#26E0C5" text-anchor="end">+24%</text>

      <rect x="0" y="56" width="236" height="46" rx="12" fill="rgba(255,255,255,.04)"/>
      <rect x="10" y="65" width="28" height="28" rx="8" fill="#FFB547" opacity=".7"/>
      <path d="M22 75 h12 M22 80 h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <rect x="48" y="70" width="110" height="5" rx="2.5" fill="rgba(255,255,255,.55)"/>
      <rect x="48" y="80" width="60" height="4" rx="2" fill="rgba(255,255,255,.3)"/>
      <text x="216" y="84" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#FFB547" text-anchor="end">NEW</text>
    </g>

    <!-- Tab bar -->
    <g transform="translate(0 430)">
      <rect x="0" y="0" width="260" height="50" fill="rgba(0,0,0,.25)"/>
      <g transform="translate(36 18)" stroke="rgba(255,255,255,.4)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-8 4 L0 -4 L8 4 V8 H-8 z"/>
      </g>
      <g transform="translate(96 18)" stroke="rgba(255,255,255,.7)" stroke-width="1.8" fill="none" stroke-linecap="round">
        <circle r="6" fill="rgba(77,139,255,.25)"/>
        <circle r="2.4" fill="#4D8BFF" stroke="none"/>
      </g>
      <g transform="translate(156 18)" stroke="rgba(255,255,255,.4)" stroke-width="1.6" fill="none" stroke-linecap="round">
        <circle r="6"/>
        <path d="M-3 0 a3 3 0 016 0 a3 3 0 01-6 0"/>
      </g>
      <g transform="translate(216 18)" stroke="rgba(255,255,255,.4)" stroke-width="1.6" fill="none" stroke-linecap="round">
        <circle r="3"/>
        <path d="M-6 8 a6 6 0 0112 0"/>
      </g>
    </g>
  </g>

  <!-- Mascots interacting with the phone -->

  <!-- Nora the Fox (left) -->
  <g transform="translate(280 380) scale(1.6)">
    <g transform="translate(-32 -32)">
      <path d="M14 22 L8 6 L22 16 Z" fill="#E36A33"/>
      <path d="M50 22 L56 6 L42 16 Z" fill="#E36A33"/>
      <path d="M14 20 L11 11 L20 17 Z" fill="#FFCBA8"/>
      <path d="M50 20 L53 11 L44 17 Z" fill="#FFCBA8"/>
      <ellipse cx="32" cy="36" rx="22" ry="20" fill="#F08552"/>
      <ellipse cx="32" cy="36" rx="22" ry="20" fill="url(#hero-mesh-1)" opacity=".18"/>
      <path d="M22 40 Q32 56 42 40 Q40 52 32 54 Q24 52 22 40 Z" fill="#FFF5EC"/>
      <ellipse cx="18" cy="42" rx="5" ry="3" fill="#FF8FA8" opacity=".5"/>
      <ellipse cx="46" cy="42" rx="5" ry="3" fill="#FF8FA8" opacity=".5"/>
      <ellipse cx="24" cy="34" rx="2.6" ry="3.1" fill="#1A1F2B"/>
      <circle cx="24.7" cy="33" r=".9" fill="#fff"/>
      <path d="M37.5 34 Q40.5 30.5 43.5 34" fill="none" stroke="#1A1F2B" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M30 42 Q32 40 34 42 Q32 45 30 42 Z" fill="#1A1F2B"/>
      <path d="M27 47 Q32 51 37 47" fill="none" stroke="#1A1F2B" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Hugo the Owl (center, peeking from below phone) -->
  <g transform="translate(550 470) scale(1.5)">
    <g transform="translate(-32 -32)">
      <path d="M12 14 L10 4 L20 12 Z" fill="#6B4423"/>
      <path d="M52 14 L54 4 L44 12 Z" fill="#6B4423"/>
      <ellipse cx="32" cy="38" rx="22" ry="22" fill="#8B5A2B"/>
      <ellipse cx="32" cy="44" rx="14" ry="16" fill="#E8D5B7"/>
      <circle cx="24" cy="32" r="9" fill="#FFF5EC"/>
      <circle cx="40" cy="32" r="9" fill="#FFF5EC"/>
      <circle cx="24" cy="32" r="9" fill="none" stroke="#1A1F2B" stroke-width="1.6"/>
      <circle cx="40" cy="32" r="9" fill="none" stroke="#1A1F2B" stroke-width="1.6"/>
      <line x1="33" y1="32" x2="31" y2="32" stroke="#1A1F2B" stroke-width="1.6"/>
      <circle cx="24" cy="33" r="2.4" fill="#1A1F2B"/>
      <circle cx="40" cy="33" r="2.4" fill="#1A1F2B"/>
      <circle cx="24.8" cy="32.2" r=".7" fill="#fff"/>
      <circle cx="40.8" cy="32.2" r=".7" fill="#fff"/>
      <path d="M28 40 L32 46 L36 40 Z" fill="#FFB547"/>
    </g>
  </g>

  <!-- Bao the Panda (right) -->
  <g transform="translate(820 400) scale(1.6)">
    <g transform="translate(-32 -32)">
      <circle cx="13" cy="16" r="7" fill="#1A1F2B"/>
      <circle cx="51" cy="16" r="7" fill="#1A1F2B"/>
      <ellipse cx="32" cy="36" rx="22" ry="21" fill="#FFFFFF"/>
      <ellipse cx="22" cy="33" rx="6" ry="7.5" fill="#1A1F2B" transform="rotate(-15 22 33)"/>
      <ellipse cx="42" cy="33" rx="6" ry="7.5" fill="#1A1F2B" transform="rotate(15 42 33)"/>
      <circle cx="22" cy="33" r="2.4" fill="#fff"/>
      <circle cx="42" cy="33" r="2.4" fill="#fff"/>
      <circle cx="22.6" cy="33.6" r="1" fill="#1A1F2B"/>
      <circle cx="42.6" cy="33.6" r="1" fill="#1A1F2B"/>
      <ellipse cx="32" cy="41" rx="2.2" ry="1.6" fill="#1A1F2B"/>
      <path d="M28 45 Q32 51 36 45 Q32 49 28 45 Z" fill="#FF6B95"/>
      <path d="M28 45 Q32 51 36 45" fill="none" stroke="#1A1F2B" stroke-width="1.4" stroke-linecap="round"/>
      <ellipse cx="14" cy="42" rx="3.5" ry="2" fill="#FF8FA8" opacity=".5"/>
      <ellipse cx="50" cy="42" rx="3.5" ry="2" fill="#FF8FA8" opacity=".5"/>
      <!-- Waving paw -->
      <circle cx="58" cy="22" r="5" fill="#1A1F2B"/>
    </g>
  </g>

  <!-- Connecting light beam from phone to top -->
  <g opacity=".6">
    <path d="M590 100 L590 30" stroke="url(#hero-grad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="590" cy="30" r="4" fill="#fff"/>
    <circle cx="590" cy="30" r="10" fill="url(#hero-grad)" opacity=".4"/>
  </g>

  <!-- Foreground sparkles -->
  <use href="#hero-spark" x="60" y="320" width="20" height="20" opacity=".8"/>
  <use href="#hero-spark" x="1110" y="80" width="18" height="18" opacity=".7"/>
  <use href="#hero-spark" x="380" y="60" width="14" height="14" opacity=".75"/>

  <!-- Soft vignette to focus on phone -->
  <rect width="1200" height="600" fill="url(#hero-mesh-1)" opacity="0"/>
</svg>
